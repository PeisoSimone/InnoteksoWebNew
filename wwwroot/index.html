    <!-- ═══════════════════════════════════════════════════════════
         ⏳ LOADING SCREEN + DISMISS API
         ═══════════════════════════════════════════════════════════
         The loader is dismissed ONLY when MainLayout.razor calls
         window.innoteksoLoader.dismiss() — never on a browser event.
         A 12-second safety timeout is the only automatic fallback.
         ═══════════════════════════════════════════════════════════ -->
    <style>
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1628 0%, #1a2842 50%, #0d1b2a 100%);
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            will-change: transform, opacity;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
        }

        .loading-brand {
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .loading-title {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,.3);
        }

        .loading-title-highlight {
            color: #4a9eff;
            text-shadow: 0 0 20px rgba(74,158,255,.5);
        }

        .loading-subtitle {
            color: rgba(255,255,255,.7);
            font-size: 0.875rem;
            margin: 0 0 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .loading-progress-container {
            width: 350px;
            max-width: 90%;
        }

        .loading-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #64b5ff);
            border-radius: 10px;
            /* Loops continuously until dismiss() fires */
            animation: loadingProgress 3s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(74,158,255,.5);
        }

        .loading-text {
            color: rgba(255,255,255,.8);
            font-size: 0.875rem;
            text-align: center;
            margin: 0;
            transition: opacity 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loadingProgress {
            0% {
                width: 0%;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 95%;
            }
        }

        /* ── EXIT: applied by JS when dismiss() fires ────────── */
        .loading-container.dismissing {
            transition: transform 1.2s cubic-bezier(.34,1.56,.64,1), opacity 1.2s cubic-bezier(.4,0,.2,1);
            transform: scale(0) translateZ(0);
            opacity: 0;
        }

            .loading-container.dismissing .loading-text,
            .loading-container.dismissing .loading-progress-container {
                opacity: 0;
                transition: opacity 0.5s ease-out;
            }

        /* ── FULLY GONE: applied after transition ends ───────── */
        .loading-container.dismissed {
            display: none;
        }

        @media (max-width: 768px) {
            .loading-title {
                font-size: 2rem;
            }

            .loading-subtitle {
                font-size: 0.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-container, .loading-brand, .loading-progress {
                animation: none !important;
            }

                .loading-container.dismissing {
                    transition: opacity 0.4s ease;
                    opacity: 0;
                }
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>

    <!-- ═══════════════════════════════════════════════════════════
         ⏳ LOADER CONTROLLER
         ═══════════════════════════════════════════════════════════
         • Rotates status text while waiting.
         • Exposes window.innoteksoLoader.dismiss() for MainLayout.
         • dismiss() uses requestAnimationFrame so the browser has
           painted the Blazor output before the loader exits.
         • 12-second hard timeout as safety net — if Blazor never
           signals (unhandled exception, WASM failure, etc.) the
           loader disappears so the user isn't stuck forever.
         ═══════════════════════════════════════════════════════════ -->
    <script>
        (function () {
            var loader = document.getElementById('innoteksoLoader');
            var textEl = document.getElementById('loadingText');
            var msgs = [
                'Preparing your experience',
                'Loading innovative solutions',
                'Connecting to the cloud',
                'Almost ready'
            ];
            var msgIdx = 0;
            var done = false;

            // ── rotate status text every 1.8 s ──────────────────────
            var textTimer = setInterval(function () {
                if (!done && textEl) {
                    textEl.textContent = msgs[msgIdx % msgs.length] + '\u2026';
                    msgIdx++;
                }
            }, 1800);

            // ── the single entry-point MainLayout.razor calls ───────
            window.innoteksoLoader = {
                dismiss: function () {
                    if (done) return;       // idempotent
                    done = true;
                    clearInterval(textTimer);

                    // rAF guarantees the browser has committed the current
                    // frame — i.e. Blazor's rendered output (including the
                    // cookie banner state) is visible before we animate out.
                    requestAnimationFrame(function () {
                        if (!loader) return;

                        loader.classList.add('dismissing');

                        // Pull from layout after the CSS transition ends
                        loader.addEventListener('transitionend', function onEnd() {
                            loader.removeEventListener('transitionend', onEnd);
                            loader.classList.add('dismissed');
                        }, { once: true });

                        // Safety: force-remove if transitionend never fires
                        // (e.g. prefers-reduced-motion skips the transition)
                        setTimeout(function () {
                            loader.classList.add('dismissed');
                        }, 1400);
                    });
                }
            };

            // ── 12-second hard safety timeout ───────────────────────
            setTimeout(function () {
                window.innoteksoLoader.dismiss();
            }, 12000);
        })();
    </script>
